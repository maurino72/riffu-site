name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Type and template check
        run: npm run check
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Formatting
        run: npm run format:check
      - name: Internal links
        run: npm run links
